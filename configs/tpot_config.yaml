experiment:
  name: "tpot_digits_classification"
  algorithm: "tpot"
  random_state: 42

data:
  dataset: "digits"
  test_size: 0.2
  preprocessing: "standard"

model:
  generations: 10
  population_size: 50
  cv_folds: 5
  verbosity: 2

evaluation:
  metrics: ["accuracy", "f1_macro", "auc"]
  cv_folds: 5
  save_artifacts: true
